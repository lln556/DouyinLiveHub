<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 抖音直播记录站</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.ico?v=2">
    <link href="/static/vendor/tailwind.min.css?v={{ asset_v('vendor/tailwind.min.css') }}" rel="stylesheet">
    <link href="/static/css/app-ui.css?v={{ asset_v('css/app-ui.css') }}" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
    <main class="w-full max-w-sm hub-card overflow-hidden">
        <div class="px-6 pt-6 pb-4 border-b border-gray-100 bg-white flex items-center gap-3">
            <div class="hub-brand-mark" aria-hidden="true">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="4" y="11" width="3" height="8" rx="1.5" fill="#94A3B8"/>
                    <rect x="9.5" y="5.5" width="3" height="13.5" rx="1.5" fill="#FFFFFF"/>
                    <rect x="15" y="8.5" width="3" height="10.5" rx="1.5" fill="#E2E8F0"/>
                    <circle cx="19" cy="5" r="2.2" fill="#FB7185"/>
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold text-gray-900 leading-tight">抖音直播记录站</h1>
                <p class="text-xs text-gray-500 mt-0.5">控制台登录</p>
            </div>
        </div>
        <form id="login-form" method="post" class="px-6 py-5 space-y-4 bg-white">
            <input type="hidden" name="next" value="{{ next_url }}">
            {% if error %}
            <div role="alert" class="px-3 py-2 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm">{{ error }}</div>
            {% endif %}
            <div>
                <label for="username" class="block text-xs font-semibold text-gray-700 mb-1.5">账号</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    autofocus
                    required
                    placeholder="管理员账号"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-200">
            </div>
            <div>
                <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">密码</label>
                <div class="relative">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="登录密码"
                        class="w-full pl-3 pr-14 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-200">
                    <button
                        type="button"
                        id="toggle-pwd-btn"
                        aria-controls="password"
                        aria-pressed="false"
                        class="absolute right-2 top-1/2 transform -translate-y-1/2 px-2 py-1 text-xs font-medium text-gray-500 hover:text-gray-800 rounded">
                        显示
                    </button>
                </div>
            </div>
            <button
                type="submit"
                id="login-submit-btn"
                class="w-full hub-btn hub-btn-primary py-2.5 text-sm">
                登录
            </button>
        </form>
    </main>
    <script>
        (() => {
            const pwd = document.getElementById('password');
            const toggleBtn = document.getElementById('toggle-pwd-btn');
            const form = document.getElementById('login-form');
            const submitBtn = document.getElementById('login-submit-btn');
            if (toggleBtn && pwd) {
                toggleBtn.addEventListener('click', () => {
                    const reveal = pwd.type === 'password';
                    pwd.type = reveal ? 'text' : 'password';
                    toggleBtn.textContent = reveal ? '隐藏' : '显示';
                    toggleBtn.setAttribute('aria-pressed', String(reveal));
                });
            }
            if (form && submitBtn) {
                form.addEventListener('submit', () => {
                    submitBtn.disabled = true;
                    submitBtn.textContent = '登录中...';
                });
            }
        })();
    </script>
</body>
</html>
