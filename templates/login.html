<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 抖音直播记录站</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white rounded-lg shadow-lg border border-gray-100">
        <div class="px-6 pt-6 pb-4 border-b">
            <h1 class="text-xl font-bold text-gray-800">抖音直播记录站</h1>
            <p class="text-sm text-gray-500 mt-1">请输入账号密码继续访问</p>
        </div>
        <form method="post" class="px-6 py-5 space-y-4">
            <input type="hidden" name="next" value="{{ next_url }}">
            {% if error %}
            <div class="px-3 py-2 rounded-lg bg-red-50 text-red-600 text-sm">{{ error }}</div>
            {% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">账号</label>
                <input
                    name="username"
                    type="text"
                    autocomplete="username"
                    autofocus
                    required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            </div>
            <button
                type="submit"
                class="w-full px-4 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">
                登录
            </button>
        </form>
    </div>
</body>
</html>
