<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归档管理 - 抖音直播记录站</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.ico?v=2">
    <script src="/static/vendor/vue.min.js?v={{ asset_v('vendor/vue.min.js') }}"></script>
    <link href="/static/vendor/tailwind.min.css?v={{ asset_v('vendor/tailwind.min.css') }}" rel="stylesheet">
    <link href="/static/css/app-ui.css?v={{ asset_v('css/app-ui.css') }}" rel="stylesheet">
    <style>
        .table-row {
            transition: background-color 0.15s ease-in-out;
        }
        .table-row:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen text-gray-900">
    <div id="app" v-cloak>
        <!-- 全站统一顶部导航栏 -->
        <nav class="hub-navbar">
            <div class="hub-navbar-inner">
                <a href="/" class="hub-brand">
                    <span class="hub-brand-mark" aria-hidden="true">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="4" y="11" width="3" height="8" rx="1.5" fill="#94A3B8"/>
                            <rect x="9.5" y="5.5" width="3" height="13.5" rx="1.5" fill="#FFFFFF"/>
                            <rect x="15" y="8.5" width="3" height="10.5" rx="1.5" fill="#E2E8F0"/>
                            <circle cx="19" cy="5" r="2.2" fill="#FB7185"/>
                        </svg>
                    </span>
                    <span>抖音直播记录站</span>
                </a>
                <div class="hub-nav-links">
                    <a href="/" class="hub-nav-link">直播控制台</a>
                    <a href="/stats" class="hub-nav-link">数据统计</a>
                    <a href="/history" class="hub-nav-link is-active">归档管理</a>
                </div>
                <div class="hub-nav-right">
                    <form method="post" action="/logout" class="inline">
                        <button type="submit" class="hub-logout-btn">退出登录</button>
                    </form>
                </div>
            </div>
        </nav>

        <main class="hub-container space-y-5">
            <header class="flex items-center justify-between gap-3">
                <h1 class="text-xl font-bold text-gray-900">归档管理</h1>
                <button
                    @click="loadArchivedRooms"
                    :disabled="loading"
                    class="hub-btn hub-btn-secondary">
                    <span v-text="loading ? '刷新中...' : '刷新列表'"></span>
                </button>
            </header>

            <section class="hub-data-strip grid grid-cols-2 md:grid-cols-4 divide-y md:divide-y-0 md:divide-x divide-gray-100">
                <div class="hub-data-cell">
                    <div class="text-xs font-medium text-gray-500">归档房间</div>
                    <div class="text-xl font-bold text-gray-900 hub-num mt-1" v-text="formatNumber(summary.totalRooms)"></div>
                </div>
                <div class="hub-data-cell">
                    <div class="text-xs font-medium text-gray-500">历史场次</div>
                    <div class="text-xl font-bold text-gray-900 hub-num mt-1" v-text="formatNumber(summary.totalSessions)"></div>
                </div>
                <div class="hub-data-cell">
                    <div class="text-xs font-medium text-gray-500">累计收入</div>
                    <div class="text-xl font-bold text-yellow-700 hub-num mt-1" v-text="formatNumber(summary.totalIncome) + ' 钻'"></div>
                </div>
                <div class="hub-data-cell">
                    <div class="text-xs font-medium text-gray-500">弹幕总数</div>
                    <div class="text-xl font-bold text-gray-900 hub-num mt-1" v-text="formatNumber(summary.totalMessages)"></div>
                </div>
            </section>

            <section class="hub-card overflow-hidden">
                <div class="px-5 py-3.5 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <h2 class="text-base font-bold text-gray-900">已归档房间</h2>
                        <span class="px-2 py-0.5 rounded-md text-xs font-semibold bg-gray-100 text-gray-600 hub-num" v-text="filteredRooms.length"></span>
                    </div>
                    <div class="relative w-full sm:w-72">
                        <input
                            v-model.trim="searchKeyword"
                            type="text"
                            placeholder="搜索主播名称或房间 ID..."
                            class="w-full pl-9 pr-8 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-200">
                        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                        </svg>
                        <button
                            v-if="searchKeyword"
                            @click="searchKeyword = ''"
                            type="button"
                            class="absolute right-2 top-1.5 text-xs text-gray-400 hover:text-gray-600">✕</button>
                    </div>
                </div>

                <div v-if="error" class="m-5 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm" v-text="error"></div>

                <!-- 桌面端表格 -->
                <div class="hidden md:block overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-100">
                            <tr>
                                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500">直播间</th>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">数据跨度</th>
                                <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500">场次</th>
                                <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500">总收入</th>
                                <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500">弹幕</th>
                                <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500">礼物</th>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">归档时间</th>
                                <th class="px-5 py-3 text-right text-xs font-semibold text-gray-500">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr v-if="!loading && filteredRooms.length === 0">
                                <td colspan="8" class="px-6 py-12 text-center text-gray-400 text-sm">
                                    <span v-text="searchKeyword ? '未找到匹配的归档直播间' : '暂无归档直播间'"></span>
                                </td>
                            </tr>
                            <tr v-if="loading">
                                <td colspan="8" class="px-6 py-12 text-center text-gray-400 text-sm">正在加载历史数据...</td>
                            </tr>
                            <tr v-for="room in filteredRooms" :key="room.live_id" class="table-row">
                                <td class="px-5 py-3.5 whitespace-nowrap">
                                    <a :href="'/stats?live_id=' + encodeURIComponent(room.live_id) + '&range=total'"
                                       class="font-semibold text-gray-900 hover:text-blue-600 block text-sm"
                                       v-text="room.anchor_name || room.live_id"></a>
                                    <div class="text-xs text-gray-400 font-mono mt-0.5" v-text="room.live_id"></div>
                                </td>
                                <td class="px-4 py-3.5 whitespace-nowrap text-xs text-gray-500 hub-num" v-text="formatDateRange(room.first_activity_at, room.last_activity_at)"></td>
                                <td class="px-4 py-3.5 whitespace-nowrap text-right text-sm text-gray-700 hub-num" v-text="formatNumber(room.total_sessions)"></td>
                                <td class="px-4 py-3.5 whitespace-nowrap text-right text-sm font-semibold text-yellow-700 hub-num" v-text="formatNumber(room.total_income)"></td>
                                <td class="px-4 py-3.5 whitespace-nowrap text-right text-sm text-gray-700 hub-num" v-text="formatNumber(room.total_chat_count)"></td>
                                <td class="px-4 py-3.5 whitespace-nowrap text-right text-sm text-gray-700 hub-num" v-text="formatNumber(room.total_gift_count)"></td>
                                <td class="px-4 py-3.5 whitespace-nowrap text-xs text-gray-500 hub-num" v-text="formatDateTime(room.archived_at)"></td>
                                <td class="px-5 py-3.5 whitespace-nowrap text-right text-sm">
                                    <div class="inline-flex items-center justify-end gap-1">
                                        <a
                                            :href="'/stats?live_id=' + encodeURIComponent(room.live_id) + '&range=total'"
                                            class="hub-row-primary">
                                            查看统计
                                        </a>
                                        <button
                                            @click="goToRoom(room.live_id)"
                                            class="hub-row-ghost">
                                            房间页
                                        </button>
                                        <button
                                            @click="restoreRoom(room)"
                                            :disabled="isRoomBusy(room.live_id)"
                                            class="hub-row-ghost is-live">
                                            恢复
                                        </button>
                                        <button
                                            @click="hardDeleteRoom(room)"
                                            :disabled="isRoomBusy(room.live_id)"
                                            class="hub-row-ghost is-danger">
                                            永久删除
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 移动端卡片视图 -->
                <div class="md:hidden divide-y divide-gray-100">
                    <div v-if="loading" class="p-8 text-center text-sm text-gray-400">正在加载历史数据...</div>
                    <div v-else-if="filteredRooms.length === 0" class="p-8 text-center text-sm text-gray-400"
                         v-text="searchKeyword ? '未找到匹配的归档直播间' : '暂无归档直播间'"></div>
                    <article v-for="room in filteredRooms" :key="'m-' + room.live_id" class="p-4 space-y-3">
                        <div class="flex items-start justify-between gap-2">
                            <div class="min-w-0">
                                <a :href="'/stats?live_id=' + encodeURIComponent(room.live_id) + '&range=total'"
                                   class="font-bold text-gray-900 truncate block"
                                   v-text="room.anchor_name || room.live_id"></a>
                                <div class="text-xs text-gray-400 font-mono truncate" v-text="room.live_id"></div>
                            </div>
                            <span class="text-xs text-gray-400 flex-shrink-0 hub-num" v-text="formatDateRange(room.first_activity_at, room.last_activity_at)"></span>
                        </div>
                        <div class="grid grid-cols-4 gap-2 text-center bg-gray-50 rounded-lg p-2.5 text-xs">
                            <div>
                                <div class="text-gray-400">场次</div>
                                <div class="font-bold text-gray-800 hub-num mt-0.5" v-text="formatNumber(room.total_sessions)"></div>
                            </div>
                            <div>
                                <div class="text-gray-400">收入</div>
                                <div class="font-bold text-yellow-700 hub-num mt-0.5" v-text="formatNumber(room.total_income)"></div>
                            </div>
                            <div>
                                <div class="text-gray-400">弹幕</div>
                                <div class="font-bold text-gray-800 hub-num mt-0.5" v-text="formatNumber(room.total_chat_count)"></div>
                            </div>
                            <div>
                                <div class="text-gray-400">礼物</div>
                                <div class="font-bold text-gray-800 hub-num mt-0.5" v-text="formatNumber(room.total_gift_count)"></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            <a :href="'/stats?live_id=' + encodeURIComponent(room.live_id) + '&range=total'"
                               class="text-center py-2 rounded-lg bg-gray-900 text-white text-xs font-semibold">查看统计</a>
                            <button @click="goToRoom(room.live_id)" class="py-2 rounded-lg border border-gray-200 text-gray-700 text-xs font-semibold">房间页</button>
                            <button @click="restoreRoom(room)" :disabled="isRoomBusy(room.live_id)" class="py-2 rounded-lg border border-gray-200 text-green-700 text-xs font-semibold">恢复</button>
                            <button @click="hardDeleteRoom(room)" :disabled="isRoomBusy(room.live_id)" class="py-2 rounded-lg border border-red-200 text-red-600 text-xs font-semibold">删除</button>
                        </div>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/js/ui-kit.js?v={{ asset_v('js/ui-kit.js') }}"></script>
    <script src="/static/js/history.js?v={{ asset_v('js/history.js') }}"></script>
</body>
</html>
